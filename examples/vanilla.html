<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Face · vanilla example</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 24px;
           background: #161616; color: #eeebe4; font: 15px/1.5 Inter, system-ui, sans-serif; }
    #face { width: 220px; height: 220px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { font: inherit; color: inherit; background: #242424; border: 1px solid #3a3a3a;
             border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="face"></div>
  <div class="row" id="states"></div>

  <script src="../agent-face.js"></script>
  <script>
    const face = new AgentFace('#face', { shape: 'Pebble', color: 'orange', state: 'Idle', theme: 'dark' });

    for (const state of AgentFace.states) {
      const button = document.createElement('button');
      button.textContent = state;
      button.title = AgentFace.stateInfo[state].useFor;
      button.onclick = () => face.setState(state);
      document.getElementById('states').append(button);
    }
  </script>
</body>
</html>
